[package]
name = "tesh"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Bowan Foryt <bowan@valstad.com>"]
description = "Triangle surface meshes and tetrahedron volume meshes with surface-level utilities"
repository = "https://github.com/valstad-shipworks/tesh"

[dependencies]
approx = { version = "0.5.1", default-features = false, optional = true }
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
glam = { version = "0.32", default-features = false }
hydroplane = { version = "0.1.0", default-features = false, features = ["glam"] }
kiddo = { version = "5.3.2", optional = true }
libm = { version = "0.2.16", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hp_analyze)'] }

[features]
default = ["std", "kdtree", "bvh"]
std = ["glam/std", "hydroplane/std", "serde?/std", "approx?/std"]
libm = ["dep:libm", "glam/libm", "hydroplane/libm", "hydroplane/alloc"]
kdtree = ["dep:kiddo", "std"]
bvh = ["std"]
serde = ["dep:serde", "serde/alloc", "glam/serde"]
bytemuck = ["dep:bytemuck", "glam/bytemuck"]
approx = ["dep:approx", "glam/approx"]

[dev-dependencies]
criterion = "0.8.2"
rand = "0.9"

[[bench]]
name = "ray"
harness = false
